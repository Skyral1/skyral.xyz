services:
  website:
    image: nginx:alpine
    container_name: website
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - /opt/website/public:/usr/share/nginx/html:ro
      - /opt/website/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`skyral.xyz`) || Host(`www.skyral.xyz`)"
      - "traefik.http.routers.website.entrypoints=websecure"
      - "traefik.http.routers.website.tls=true"
      - "traefik.http.routers.website.tls.certresolver=cloudflare"
      - "traefik.http.services.website.loadbalancer.server.port=80"
